<style>

<script>
/* Exam answers — written as original study notes based on Ivey, Ivey & Zalaquett (2018, 9th ed.) and Egan (2014, 10th ed.). Page numbers refer to those editions. */
const ANSWERS=[
{id:"skills",book:"Ivey",ch:"Ch 1–12",pages:"pp. 3–306",name:"Interviewing skills (microskills)",art:"pyramid",
 plan:["Define intentional interviewing and microskills","Microskills hierarchy: foundation → apex","Attending (3 V's + B) and observation","Basic listening sequence: questions, encouragers, paraphrase, reflection of feeling, summary","Empathy: subtractive, basic, additive","Five-stage session structure","Focusing, empathic confrontation, reflection of meaning, interpretation/reframe","Influencing skills: self-disclosure, feedback, logical consequences, psychoeducation","Integration, personal style and conclusion"],
 body:`<h3>Introduction</h3>
<p>Ivey, Ivey and Zalaquett describe interviewing, counselling and psychotherapy as overlapping processes. Interviewing is the most basic: gathering information and helping clients resolve issues. Counselling deals with normal developmental and adjustment concerns. Psychotherapy works with deeper, longer-standing difficulties. All three rely on the same set of <b>microskills</b>: single, observable units of communication, such as an open question or a reflection of feeling, that can be learned one at a time and then combined into a natural style. The aim is <b>intentionality</b>: being able to choose, from many possible responses, the one most likely to help this particular client. If one response doesn't work, the intentional counsellor flexes and tries another.</p>
<h3>The microskills hierarchy</h3>
<p>The skills are arranged as a pyramid. The <b>foundation</b> is ethics, multicultural competence, positive psychology and resilience, therapeutic lifestyle changes and neuroscience. Above that sit <b>attending and observation</b>, then the <b>basic listening sequence</b>, then the <b>five-stage session</b>, then <b>focusing, empathic confrontation, reflection of meaning and interpretation/reframing</b>, then the <b>influencing skills</b>. At the apex are <b>skill integration, personal style and transcendence</b>, the ability to go beyond what one has been taught and adapt it creatively. All counselling theories use the same microskills in different patterns, so mastering them prepares the counsellor for any theory.</p>
<h3>Attending and observation</h3>
<p><b>Attending behaviour</b> is summarised as <b>3 V's + B</b>: <i>visual/eye contact</i>, <i>vocal qualities</i> (tone and speech rate), <i>verbal tracking</i> (staying with the client's topic rather than changing the subject) and <i>body language</i> (facing the client naturally, leaning slightly forward, an expressive face). All four must be adapted to individual and cultural differences, for example where direct eye contact feels intrusive. Attending reduces counsellor talk time so the client can tell the story. <b>Observation skills</b> track the client's nonverbal behaviour, verbal patterns (key words, "I" versus "other" statements, concrete versus abstract style) and <b>discrepancies</b> (mixed messages, words versus actions). Good rapport often shows as <b>movement synchrony</b>, and its absence as dyssynchrony.</p>
<h3>The basic listening sequence</h3>
<p>Built on attending, the BLS draws out the client's story with its facts, thoughts, feelings and behaviours. <b>Open questions</b> (what, how, why, could) invite elaboration; <b>closed questions</b> (is, are, do) gather specifics but put the burden of talk on the counsellor. <b>Encouragers</b> (nods, "uh-huh", repeating key words) keep the client talking, and a <b>restatement</b> repeats the client's exact words. A <b>paraphrase</b> feeds back the essence of what was said in a shorter, clearer form, using the client's main words plus some of the counsellor's own; it is the key to cognitive empathy. <b>Reflection of feeling</b> names the emotion behind the words, and a <b>summary</b> pulls together a longer stretch of conversation, including emotions. Adding a <b>checkout</b> ("Is that right?") lets the client correct the counsellor.</p>
<h3>Empathy</h3>
<p>Empathy is entering the client's world and communicating that understanding. Ivey rates responses on three anchor points. <b>Subtractive</b> responses give back less than the client said or distort it. <b>Basic</b> (interchangeable) responses say back accurately what the client said; skilled use of the BLS shows basic empathy. <b>Additive</b> responses add something useful, such as a link to an earlier statement or a new frame. Influencing skills used well are typically additive.</p>
<h3>The five-stage session</h3>
<p>The skills are organised into a session structure that works across theories: (1) <b>empathic relationship</b>: rapport, structuring, early goals; (2) <b>story and strengths</b>: gathering data while drawing out positive assets; (3) <b>goals</b>: set collaboratively; (4) <b>restory</b>: exploring alternatives, confronting incongruities, rewriting the narrative; (5) <b>action</b>: taking new thoughts and behaviours into daily life. The stages are a checklist for every session, not a rigid script. <b>Decision counselling</b> follows the same structure.</p>
<h3>Transitioning to influence</h3>
<p><b>Focusing</b> widens the lens through seven foci: client, main theme, others, mutual "we", counsellor, cultural/environmental/contextual, and here-and-now. <b>Empathic confrontation</b> is a supportive challenge: listen, point out the discrepancy ("On one hand…, but on the other hand…"), then evaluate the client's response on the <b>Client Change Scale</b>, from denial through to transcendence. <b>Reflection of meaning</b> ("What does that mean to you?") explores values and purpose from the client's own frame. <b>Interpretation/reframe</b> offers the counsellor's new perspective, often drawn from a theory.</p>
<h3>Influencing skills</h3>
<p>Here the counsellor contributes more actively, but the client stays the decider. <b>Self-disclosure</b> should be brief, genuine, timely and in the present tense. <b>Feedback</b> should be concrete, nonjudgmental, focused on strengths and checked out with the client. <b>Logical consequences</b> help clients foresee the likely results of a choice ("If you do…, then… may follow"). <b>Psychoeducation</b>, directives, stress management and therapeutic lifestyle changes help clients act.</p>
<h3>Conclusion</h3>
<p>Interviewing skills move from listening to influencing. They rest on an ethical, multicultural and neuroscientific foundation and are integrated into a session that runs from relationship to action. Ivey's message is that competence comes from deliberate practice and from flexibly matching each skill to the client in front of you, until the skills become a natural personal style.</p>`},
{id:"bls",book:"Ivey",ch:"Ch 5–8",pages:"pp. 109–195 (BLS defined p. 179)",name:"Basic listening sequence (BLS)",art:"bls",
 plan:["Definition: attending + observation foundation","Five skills: questions, encouraging, paraphrasing, reflecting feelings, summarizing","What each skill does for the client (story, cognition, emotion, mentalizing)","Checkout","Order is flexible; adapt to client","BLS across settings (counselling, management, medicine, daily life)","BLS inside the five stages","Anticipated client response; conclusion"],
 body:`<h3>Introduction</h3>
<p>The <b>basic listening sequence (BLS)</b> is Ivey's name for the core group of listening skills used to draw out a client's story. It rests on attending and observation, and on the foundation of ethics, multicultural competence, positive psychology and neuroscience. Ivey notes that the same sequence is used by effective physicians, managers, teachers and friends, so it is a general model of empathic listening, not just a counselling technique.</p>
<h3>The skills of the BLS</h3>
<p><b>1. Open and closed questions.</b> Open questions usually come first because they let the client choose what to talk about ("Could you tell me what you'd like to discuss?"). Closed questions then bring out specifics ("How long has this been happening?"). "What else?" questions bring out missing parts of the story.</p>
<p><b>2. Encouraging.</b> Head nods, an open palm, "uh-huh" and repeating key words keep the client talking and signal that the counsellor is following. A <b>restatement</b> repeats the client's own phrase and gently directs attention to it. Encouragers are used throughout the session.</p>
<p><b>3. Paraphrasing.</b> The counsellor feeds back the essence of what the client said, shortened and clarified, using the client's key words plus some of their own. Paraphrasing captures the <b>cognitive</b> side of the story and supports the client's executive functioning, their ability to organise and think clearly about the issue.</p>
<p><b>4. Reflecting feelings.</b> The counsellor names the emotions behind the story ("You feel worried when…"). This supports <b>emotional regulation</b> and lets the client look at the complexity of their feelings.</p>
<p><b>5. Summarizing.</b> A longer synthesis of facts, thoughts and feelings over part or all of a session. It brings order to scattered material and is central to <b>mentalizing</b> (Theory of Mind), understanding and joining the client's perspective. Summaries can open a session, mark a transition and close a session.</p>
<p><b>The checkout.</b> Ending a paraphrase, reflection or summary with "Am I hearing you correctly?" gives the client a chance to correct the counsellor. It turns listening into a collaborative check on accuracy.</p>
<h3>How the BLS is used</h3>
<p>The skills need not follow a fixed order, but all of them should be used when listening to a client's story. The counsellor uses observation to notice how the client reacts and flexes the style accordingly. A more reserved client may need more encouragers and fewer questions, and a talkative client may need summaries to bring focus.</p>
<p>Ivey shows the BLS working in four settings. A counsellor helps a client explore a career decision, a manager investigates a production problem, a doctor gathers a patient's headache history, and a friend listens to someone describe a loan meeting. The same five moves apply each time. This is why the BLS is taught in medical schools and used to train helpers around the world.</p>
<h3>The BLS and the five-stage session</h3>
<p>The BLS is the engine of a session conducted with listening skills only. In <b>Stage 1</b> it builds rapport. In <b>Stage 2</b> (story and strengths) it gathers the facts, thoughts, feelings and behaviours. In <b>Stage 3</b> it helps define goals. In <b>Stage 4</b> it explores alternatives, and in <b>Stage 5</b> it checks the client's commitment to action. Ivey points out that many clients can resolve their concerns using only attending, observation and the BLS, without any influencing skills.</p>
<h3>Anticipated client response</h3>
<p>When the BLS is used well, clients discuss their stories, including the key facts, thoughts, feelings and behaviours, and feel that they have been heard. The counsellor gains a full picture of the client's concern before attempting any change. Clients often stop repeating themselves and start exploring new ground.</p>
<h3>Conclusion</h3>
<p>The BLS is the foundation of empathic understanding. Questions open the story, encouragers keep it going, paraphrases capture its meaning, reflections capture its emotion, and summaries integrate it. Checkouts keep the process accurate.</p>`},
{id:"rof",book:"Ivey",ch:"Ch 7",pages:"pp. 154–178 (dimensions p. 160)",name:"Reflection of feeling: the dimensions",art:"rof",
 plan:["Why reflection of feeling is the heart of empathy","Emotions vs feelings; primary vs social emotions","How to identify emotions (5 sources)","The skill dimensions: stem, feeling label, context, tense/immediacy, checkout, positive emotions","Acknowledgment of feelings","Micro and macro nonverbals of emotion","Cautions: art not formula; culture","Conclusion"],
 body:`<h3>Introduction</h3>
<p>Ivey calls reflection of feeling "the heart of empathic understanding". Paraphrasing captures what the client <i>thinks</i>; reflection of feeling captures what the client <i>feels</i>. Since emotions drive much of our thinking and behaviour, naming and sorting them is often what makes change possible.</p>
<h3>Emotions and feelings</h3>
<p>Emotions are bodily based reactions, and feelings are the words we use to describe their mixtures. Ivey treats <b>sad, mad, glad and scared</b> as primary emotions that appear universal and serve as root words for a feeling vocabulary. <b>Social emotions</b> such as guilt, embarrassment and pride are built on these and learned in family and cultural contexts. Words like "confused" or "mixed up" often signal conflicting emotions underneath.</p>
<h3>Identifying emotions</h3>
<p>The counsellor attends to: (1) emotional words the client uses; (2) implicit feelings that are not spoken; (3) nonverbal expressions in face and body; (4) micro nonverbal expressions; and (5) mixed verbal and nonverbal cues, which often show a discrepancy. Vocal tone, hesitations and changes in loudness are further clues.</p>
<h3>The skill dimensions of reflection of feeling</h3>
<p><b>1. Sentence stem.</b> Begin with a stem such as "Sounds like you feel…", "I sense you're feeling…" or "Could it be that you feel…?" Stems are easily overused and can sound comical, so vary them or leave them out. Using the client's name and "you" personalises the reflection.</p>
<p><b>2. Feeling label.</b> Add an emotion word: "Priya, you seem to feel sad…". For mixed feelings, use more than one label: "You feel both excited and nervous…".</p>
<p><b>3. Context or brief paraphrase.</b> Link the feeling to its source with words like <i>about</i>, <i>when</i> or <i>because</i>: "…anxious <i>when</i> the exam paper is handed out."</p>
<p><b>4. Tense and immediacy.</b> Present-tense reflections ("Right now you look very angry") are usually more powerful than past or future ones. Some clients find the here-and-now too intense, and a "there and then" reflection may feel safer.</p>
<p><b>5. Checkout.</b> Ask whether the reflection is accurate ("Am I hearing you correctly?"), especially when naming a feeling the client hasn't said aloud. This lets the client correct you, or hold back if you're closer to a truth than they're ready to admit.</p>
<p><b>6. Bring out positive emotions and strengths.</b> Reflecting only fear, anger and sadness can reinforce negative thinking. Drawing out positive emotional stories alongside difficulties builds resilience and helps resolution.</p>
<p><b>Model example:</b> "Arjun, sounds like you're feeling <i>anxious and a bit embarrassed</i> right now <i>about</i> blanking out in the exam… is that right?" This has a name and stem, two labels, context, present tense and a checkout.</p>
<h3>Acknowledgment of feelings</h3>
<p>A lighter form: briefly recognising a feeling ("That must be frustrating") and moving on. It puts less pressure on the client and is useful early in counselling, with less verbal clients, with children, and across cultures where open emotional talk is less comfortable.</p>
<h3>Micro and macro nonverbals</h3>
<p>Macro nonverbals are easy to see: downcast eyes, turning away, a quiet voice. Micro-expressions are fleeting flashes of concealed emotion, as quick as about one-fifteenth of a second. They are best noted silently and raised later, since the client may not be aware of them. Ivey lists typical cues for emotions such as sadness (drooping eyelids, a downturned mouth, slumped posture) and anger (upright, tense body, tightened lips).</p>
<h3>Cautions</h3>
<p>Reflection of feeling is a skill but also an art. Used mechanically it removes authenticity from the relationship. Cultures and individuals differ in how openly they express emotion, so avoid stereotyping and adjust the depth of reflection to the client. The long-term goal is <b>emotional regulation</b>: helping clients experience and manage feelings in the here and now.</p>`},
{id:"neuro",book:"Ivey",ch:"Ch 1, 2, 3, 12 & Appendix IV",pages:"pp. 16–17, 68–69, 285–286, App. IV",name:"Neuroscience: neuroplasticity, neurogenesis, neural coupling",art:"neuro",
 plan:["Why neuroscience matters to counselling","Neuroplasticity: the brain rewires; counselling builds new networks","Neurogenesis: new neurons, hippocampus; TLCs, exercise, BDNF","Negative plasticity / negative neurogenesis: stress, cortisol","Mirror neurons and empathy (Singer et al., 2004)","Neural coupling: speaker–listener brains align; breaks with poor listening","Active listening lights up the brain: ventral striatum, mPFC, right anterior insula (Kawamichi et al., 2015)","Implications for practice; conclusion"],
 body:`<h3>Introduction</h3>
<p>Ivey and colleagues argue that neuroscience now supports what counsellors long believed: the counselling conversation changes the brain. Brain-imaging methods such as fMRI let researchers see how listening, empathy and stress affect neural activity. This makes counselling a more clearly scientific undertaking and gives counsellors a language for explaining to clients how therapy works.</p>
<h3>Neuroplasticity</h3>
<p>Neuroplasticity is the brain's ability to change and reorganise itself throughout life. The old idea of a fixed adult brain is wrong. Experiences, learning and relationships continually add and prune neurons, synapses and connections, so the brain can "rewire" itself. For counselling this means that new ways of thinking, feeling and acting practised in and between sessions become physically encoded as new neural networks. Successful therapy can be expected to build new, useful connections.</p>
<h3>Neurogenesis</h3>
<p>Neurogenesis is the birth of completely new neurons, which continues even in old age. It occurs mainly in the <b>hippocampus</b>, the main seat of memory. Ivey links neurogenesis to the <b>therapeutic lifestyle changes (TLCs)</b>: exercise, sleep, nutrition, social relationships, cognitive challenge, cultural health and similar habits. Exercise is singled out because it increases blood flow, serotonin and BDNF (brain-derived neurotrophic factor), which supports new neurons and a larger hippocampus. Counselling conversations that produce new learning, such as a client reframing a painful experience, are described as contributing to new neural connections.</p>
<h3>Negative plasticity and stress</h3>
<p>Plasticity works in both directions. Moderate stress can "pump us up" and helps the brain grow. Severe or chronic stress (trauma, poverty, bullying, racism, abuse, continual workplace pressure) raises cortisol, which can damage neurons and networks. Ivey calls this <b>negative neurogenesis</b> or negative plasticity. Because stress underlies most client concerns, stress management and the TLCs become central to almost all counselling.</p>
<h3>Mirror neurons and empathy</h3>
<p>Mirror neurons fire both when we act and when we watch someone else act, giving a neural basis for empathy. In Singer and colleagues' (2004) study, when one partner received a mild shock, the observing partner's emotional pain areas fired at the same time as their partner's. Mirror-neuron activation has been reported as reduced in conduct and antisocial personality disorders. Marci and colleagues (2007) found that counsellor and client skin conductance rose in parallel when the client felt understood.</p>
<h3>Neural coupling</h3>
<p>Communication is a joint brain activity. In fMRI research on storytelling (Stephens, Silbert & Hasson, 2010), the listener's brain activity <b>couples</b> with the speaker's, so their patterns mirror each other, sometimes with the listener even anticipating the speaker. The stronger the coupling, the better the listener understood the story. Ivey stresses the reverse: when comprehension fails, neural coupling disappears. Applied to counselling, subtractive listening breaks the shared neural rhythm and empathy "falls apart", while accurate paraphrases and reflections keep counsellor and client in sync. Oliveira-Silva and Gonçalves (2011) similarly found heart rate changes in observers showing additive empathy but not in those whose responses were interchangeable or subtractive.</p>
<h3>Active listening lights up the brain</h3>
<p>Kawamichi and colleagues (2015) scanned people while they heard listeners respond to their emotional stories with or without active listening. Active listening activated the <b>ventral striatum</b> (the reward system), the <b>medial prefrontal cortex</b> (cognitive empathy) and the <b>right anterior insula</b> (affective empathy and emotional appraisal). Being listened to well is literally rewarding. Other research suggests empathic listening may even increase grey matter.</p>
<h3>Implications and conclusion</h3>
<p>For practice: attend carefully, because good listening is neurologically rewarding and builds alliance. Aim for at least basic, and where helpful additive, empathy to maintain neural coupling. Help clients manage stress to prevent negative plasticity. Encourage TLCs, especially exercise, to support neurogenesis. Remember that every session is an opportunity to build new neural networks for more adaptive thoughts, emotions and actions.</p>`},
{id:"stages",book:"Egan",ch:"Ch 8–14",pages:"pp. 219–404",name:"Egan's stages and the tasks under each",art:"egan",
 plan:["Skilled Helper = problem-management and opportunity-development model","Stage I (current picture): I-A story, I-B real story, I-C right story","Stage II (preferred picture): II-A possibilities, II-B goals, II-C commitment","Stage III (way forward): III-A possible strategies, III-B best-fit strategies, III-C plan","The action arrow and implementation","Flexibility: entry points, back-and-forth, not linear","Communication skills underneath all stages","Conclusion"],
 body:`<h3>Introduction</h3>
<p>Gerard Egan's <i>Skilled Helper</i> model is a <b>problem-management and opportunity-development</b> approach. Egan argues that some version of this process lies at the heart of almost every form of therapy. Helping is about clients managing problem situations and developing unused opportunities more effectively, and becoming better at helping themselves. The model has <b>three stages, each with three tasks</b>, all sitting on an <b>action arrow</b>, and is delivered through the communication skills of the helping dialogue. Each task is framed as a question the client asks themselves.</p>
<h3>Stage I: The current picture ("What's going on?")</h3>
<p><b>Task I-A: The story.</b> "What's going on in my life? What are my main concerns?" The helper helps the client tell their story clearly, with neither too much nor too little detail. Guidelines include working with every style of storytelling, starting where the client starts, assessing severity, clarifying key issues, exploring context, talking productively about the past, spotting unused opportunities and resources, and seeing problems as opportunities. Clients are encouraged to act from the very first session and to use time between sessions productively.</p>
<p><b>Task I-B: The real story.</b> "What's really going on? What new perspectives would help?" Using challenging skills, the helper invites the client to work through <b>blind spots</b>, uncover hidden concerns, clarify vague issues, own their problems, state them as solvable and participate fully. <b>Immediacy</b>, talking about what is happening in the helping relationship itself, belongs here.</p>
<p><b>Task I-C: The right story.</b> "What should I work on? Which issues will make a real difference?" The helper helps the client choose high-leverage issues: manage a crisis first, start with what causes most pain or what the client sees as important, pick a manageable problem that can lead to general improvement, and make sure the benefits outweigh the costs. The helper also decides whether helping is called for at all.</p>
<h3>Stage II: The preferred picture ("What do I need or want?")</h3>
<p><b>Task II-A: Possibilities.</b> "What possibilities do I have for a better future?" The helper builds <b>hope</b> and helps the client imagine a better future through possible selves, creativity, divergent thinking, brainstorming and models.</p>
<p><b>Task II-B: Goals.</b> "What do I really want and need?" The helper turns possibilities into a <b>change agenda</b>. Goals should be stated as outcomes, specific, able to make a difference, realistic, prudent, sustainable, flexible, consistent with the client's values, and set within realistic time frames. The helper helps the client distinguish needs from wants and consider coping and adaptive goals.</p>
<p><b>Task II-C: Commitment.</b> "What am I willing to pay for what I want?" Commitment is a dimension of goal-setting rather than a separate step. The helper helps clients make the goals appealing, find incentives, own the agenda, manage competing agendas and obstacles, and build <b>self-efficacy</b> ("I can, I will").</p>
<h3>Stage III: The way forward ("How do I get what I need or want?")</h3>
<p><b>Task III-A: Possible strategies.</b> "What actions could get me there?" Brainstorm many strategies, use frameworks to stimulate thinking, and identify the knowledge and skills needed.</p>
<p><b>Task III-B: Best-fit strategies.</b> "Which strategies are best for me?" Choose strategies that are specific, effective, realistic and consistent with the client's values. Sample before choosing, and use a balance-sheet method to weigh costs and benefits.</p>
<p><b>Task III-C: Plans.</b> "What should my campaign for change look like? What first, second, third?" Turn strategies into a realistic, step-by-step plan with time frames and contingency plans, tailored to the client's style. Egan stresses that a plan without action is only a wish list.</p>
<h3>The action arrow and implementation</h3>
<p>All three stages are about planning for change, not change itself. Implementation (Ch 14) helps clients turn plans into action. This includes overcoming procrastination, avoiding imprudent action, anticipating obstacles, finding resources, incentives and rewards, using self-contracts and implementation intentions, building social support and challenge, and tapping into resilience. Action should start immediately and continue throughout helping.</p>
<h3>Flexibility</h3>
<p>The stages are logical but not linear. Clients can enter at any stage, move back and forth, and work on several tasks in one session. The model is a <b>shared map</b>, not a script to impose. Running underneath every stage are the communication skills: tuning in, active listening, empathic responding, checking understanding, probing, summarizing, challenging and negotiating.</p>
<h3>Conclusion</h3>
<p>Egan's model gives the helper a clear, client-directed and outcome-informed structure: understand the current picture, design the preferred picture, and plan the way forward, all on a bias for action.</p>`},
{id:"termination",book:"Egan",ch:"Ch 1, 5, 8, 14",pages:"pp. 19–21, 150–151, 231–232, 401–403",name:"Ending a session and ending helping",art:"ending",
 plan:["Note: Egan has no single 'termination' chapter; draw on feedback, summarizing, implementation","Ending a session: summary, review of learning, what to do 'out there'","End-of-session feedback: 'How are we doing?'; session-rating survey (Duncan/Miller)","Linking to between-session action and implementation intentions","Ending the helping relationship: getting along without a helper","Avoiding co-dependent, endless helping; choosing not to change","Ivey's Stage 5 (action) as a parallel","Conclusion"],
 body:`<h3>Introduction</h3>
<p>Egan does not have a single chapter called "termination". His ideas about ending appear in three places: two-way feedback at the end of every session (Ch 1 and Ch 8), the use of summaries to close (Ch 5), and preparing clients to get along without a helper (Ch 14). Together they give a clear picture of how a skilled helper ends a <b>session</b> and how they end the <b>helping relationship</b>.</p>
<h3>Ending a session</h3>
<p><b>Summarize.</b> A summary near the end pulls the main points together, shows the client they have been heard, and gives the client a clearer, more organised picture to take away. Egan, following Brammer, notes that summaries bring a theme to a close and give focus and direction.</p>
<p><b>Review learning and action.</b> In Egan's case of Laura and Karl, Laura ends each session by helping Karl review what happened, what he learned, and what he needs to do "out there" before the next meeting. Because the whole model sits on an action arrow, every session should end with some agreed step, even a small one, so the time between sessions is used productively.</p>
<p><b>Ask for feedback: "How are we doing?"</b> Egan treats feedback as a key ingredient of successful therapy. Toward the end of each session the helper checks how the session went: whether the relationship feels right, whether the session dealt with the right topics and goals, whether the approach fits the client, and overall satisfaction. This can be done with a brief survey (Duncan, Miller and colleagues' session-rating system) or informally as a natural part of the dialogue. A matching survey at the start of each session tracks progress in the client's life. The message to the client is "Your input matters, and we will adjust to get you what you want."</p>
<p><b>Form implementation intentions.</b> Especially where obstacles are foreseen, help the client specify when, where and how they will act ("If X happens, I will do Y"), so the agreement survives once the client leaves the room.</p>
<h3>Ending the helping relationship</h3>
<p>Egan is sceptical of clients staying "in therapy" for years. The goal of helping is for clients to manage their lives <b>without a helper</b>. Endings can take several forms: the client takes over the plan after it is developed; the client continues until changes are "in place" and then maintains them alone; the client moves to a self-help group with occasional individual sessions; the client returns occasionally as needed; or, for some chronic conditions, the client uses therapy throughout life. Box 14.2 lists "prepare clients to get along without a helper" as an explicit implementation guideline.</p>
<p><b>Shadow side.</b> Some helpers enter a covert conspiracy with clients to keep the relationship going, so that talk replaces life-enhancing outcomes and the co-dependent relationship becomes the problem. Ending well means building the client's self-help skills, a social support and challenge system, and resilience.</p>
<p><b>Choosing not to change.</b> Some clients, after understanding their problem and planning, decide the price of change is too high. The helper invites them to look at incentives and the consequences of not changing, but ultimately respects that it is the client's choice.</p>
<h3>Link with Ivey</h3>
<p>Ivey's <b>Stage 5 (action)</b> serves the same purpose: generalising learning to daily life, agreeing homework, summarising the session and planning follow-up. Both authors end sessions with a summary, a concrete next step and an invitation for the client to evaluate.</p>
<h3>Conclusion</h3>
<p>For Egan, ending is built into the process from the start. Every session closes with a summary, a review of learning, agreed action and client feedback. The relationship itself ends when the client has the skills, support and resilience to keep going alone.</p>`},
{id:"compare",book:"Both",ch:"Ivey Ch 1, 8 · Egan Ch 1, 8",pages:"Ivey pp. 3–25, 179–195 · Egan pp. 3–35, 219–235",name:"Egan vs Ivey: comparison",art:"compare",
 plan:["Introduce both: Ivey's microskills / five stages vs Egan's skilled helper","Similarities: client-centred, empathy, structure, strengths, action, culture, feedback","Differences: unit of analysis (skill vs task/outcome)","Structure: 5 stages vs 3 stages × 3 tasks + action arrow","Relationship: explicit Stage 1 vs skills running underneath","Challenge: confrontation & Client Change Scale vs self-challenge, blind spots","Emphasis: neuroscience, multicultural, TLCs vs problem management, decision-making, shadow side","Table + conclusion"],
 body:`<h3>Introduction</h3>
<p>Allen Ivey's <i>Intentional Interviewing and Counseling</i> and Gerard Egan's <i>The Skilled Helper</i> are both skills-based, integrative approaches that can work under any counselling theory. Ivey builds from single microskills up to a five-stage session. Egan builds from a problem-management process supported by communication skills. Both are widely used in training.</p>
<h3>Similarities</h3>
<ul class="items"><li><b>Client-centred base.</b> Both rest on Rogers' empathy and respect. The client is the decider (Ivey) and in the "driver's seat" (Egan).</li><li><b>Structure that is flexible.</b> Both offer a sequence (relationship → story → goals → action) but insist it is a map or checklist, not a rigid script; clients move back and forth.</li><li><b>Same listening skills.</b> Ivey's attending and BLS overlap with Egan's tuning in (SOLER), active listening, empathic responding, probing and summarizing.</li><li><b>Strengths and opportunity.</b> Ivey's positive asset search and Egan's unused opportunities and resources both balance the problem focus.</li><li><b>Bias for action.</b> Ivey's Stage 5 and Egan's action arrow both insist that change must reach daily life.</li><li><b>Diversity and feedback.</b> Both stress culture (Ivey's RESPECTFUL model, Egan's "personal culture") and checking with the client (checkouts; "How are we doing?").</li></ul>
<h3>Differences</h3>
<p><b>Unit of analysis.</b> Ivey's basic unit is the individual <b>microskill</b>, taught one at a time in a hierarchy. Egan's basic unit is the <b>task</b> or outcome: what the client needs to accomplish at each point.</p>
<p><b>Structure.</b> Ivey has <b>five stages</b> (empathic relationship, story and strengths, goals, restory, action). Egan has <b>three stages with three tasks each</b> (story, real story, right story; possibilities, goals, commitment; possible strategies, best-fit strategies, plan) plus implementation.</p>
<p><b>Relationship.</b> Ivey makes the empathic relationship its own first stage. Egan treats the relationship and dialogue skills as running underneath every stage.</p>
<p><b>Challenge.</b> Ivey uses <b>empathic confrontation</b> of discrepancies and evaluates the response with the Client Change Scale. Egan speaks of inviting <b>client self-challenge</b> and working through blind spots (Task I-B), and adds helper self-challenge and managing reluctance and resistance.</p>
<p><b>Meaning versus planning.</b> Ivey gives a distinct place to <b>restorying</b>, reflection of meaning and reframing. Egan gives more weight to <b>goal-setting, commitment and strategy selection</b>, with tools like the balance sheet and contingency plans.</p>
<p><b>Distinctive emphases.</b> Ivey foregrounds <b>neuroscience</b>, multicultural competence, positive psychology and therapeutic lifestyle changes. Egan foregrounds <b>decision-making</b>, the common factors ("ingredients of successful therapy"), the <b>shadow side</b> of helping, and ongoing client feedback.</p>
<div class="tbl"><table><thead><tr><th>Point</th><th>Ivey</th><th>Egan</th></tr></thead><tbody>
<tr><td>Core idea</td><td>Intentional use of microskills</td><td>Problem management & opportunity development</td></tr>
<tr><td>Structure</td><td>5 stages</td><td>3 stages × 3 tasks + action arrow</td></tr>
<tr><td>Starting point</td><td>Empathic relationship (stage 1)</td><td>Story (I-A); relationship skills underneath</td></tr>
<tr><td>Goals</td><td>Stage 3: goals</td><td>Stage II: possibilities, goals, commitment</td></tr>
<tr><td>Change work</td><td>Restory: confrontation, meaning, reframe</td><td>Stage III: strategies, best fit, plan</td></tr>
<tr><td>Challenge</td><td>Empathic confrontation; Client Change Scale</td><td>Self-challenge; blind spots; immediacy</td></tr>
<tr><td>Nonverbal</td><td>3 V's + B</td><td>SOLER</td></tr>
<tr><td>Extra emphasis</td><td>Neuroscience, TLCs, multicultural</td><td>Decision-making, shadow side, feedback</td></tr>
</tbody></table></div>
<h3>Conclusion</h3>
<p>The two models describe the same journey from understanding to action at different levels. Ivey answers "What do I say, moment to moment?" and Egan answers "Where is this helping process going, and what must the client accomplish?" A trainee who uses Ivey's microskills inside Egan's stage-and-task map has both the skills and the direction.</p>`}
];

["Ivey","6 · Encourage, paraphrase, summarize","What does a summary add over a paraphrase?","A longer time span, more information and the emotional tone. Used to open, transition and close."],
["Ivey","6 · Encourage, paraphrase, summarize","What is mentalizing / Theory of Mind?","Understanding others' mental states (beliefs, intentions, perspectives). Summaries support it; the temporal parietal junction is involved."],
["Ivey","6 · Encourage, paraphrase, summarize","Link between listening and executive functioning?","Paraphrases and summaries help clients organise thinking and regulate emotion, functions of the frontal lobes."],
["Ivey","7 · Reflecting feelings","Primary emotions?","Sad, mad, glad, scared, which appear universal. Social emotions (guilt, pride, embarrassment) build on them."],
["Ivey","7 · Reflecting feelings","Acknowledgment vs reflection of feeling?","Acknowledgment briefly names a feeling and moves on; reflection explores it with stem, label, context, tense and checkout."],
["Ivey","7 · Reflecting feelings","What is a micro-expression?","A fleeting expression of concealed emotion, as fast as about 1/15 of a second. Note it silently first."],
["Ivey","8 · Five stages & BLS","Five stages of Ivey's session?","Empathic relationship · story & strengths · goals · restory · action."],
["Ivey","8 · Five stages & BLS","What is decision counselling?","A five-stage model for helping clients make decisions: define the issue, set the goal, generate and choose alternatives, act."],
["Ivey","8 · Five stages & BLS","Why take notes carefully?","Accurate records are essential. If the counsellor is relaxed about note taking, clients usually are too."],
["Ivey","9 · Focusing","Seven types of focus?","Client, main theme/problem, others, mutual 'we', counsellor, cultural/environmental/contextual, here-and-now."],
["Ivey","9 · Focusing","What are genograms used for?","Family and community genograms visually map relationships, stressors and strengths in the client's context."],
["Ivey","10 · Empathic confrontation","Define empathic confrontation.","A supportive challenge: note discrepancies, feed them back ('On one hand… on the other…'), attend to emotion, and help resolve them."],
["Ivey","10 · Empathic confrontation","Levels of the Client Change Scale?","1 denial · 2 partial examination · 3 acceptance and recognition · 4 creation of a new solution · 5 transcendence (new, larger constructs)."],
["Ivey","11 · Meaning & reframe","How do you elicit meaning?","'What does ___ mean to you?', 'What sense do you make of it?', 'What values underlie that?'"],
["Ivey","11 · Meaning & reframe","Reflection of meaning vs interpretation/reframe?","Meaning comes from the client's own values; a reframe gives a new perspective from the counsellor or a theory."],
["Ivey","11 · Meaning & reframe","Whose work grounds reflection of meaning?","Viktor Frankl: the last human freedom is to choose one's attitude."],
["Ivey","12 · Influencing & stress","Guidelines for self-disclosure?","Use 'I' statements and feeling or thought verbs; be genuine, timely, brief and in the present tense."],
["Ivey","12 · Influencing & stress","Guidelines for feedback?","Client in charge, focus on strengths, concrete, nonjudgmental, here-and-now, lean, and check how it was received."],
["Ivey","12 · Influencing & stress","Steps of logical consequences?","Listen, explore positive and negative consequences, comment nonjudgmentally, summarise, let the client decide."],
["Ivey","12 · Influencing & stress","How does stress affect the brain?","Optimal stress promotes neurogenesis; chronic or severe stress raises cortisol and causes negative neurogenesis."],
["Ivey","13–14 · Theory & integration","How do theories use microskills?","Every theory (person-centred, CBT, crisis counselling and others) uses the microskills in different patterns."],
["Ivey","13–14 · Theory & integration","What is transcendence?","Going beyond what you've learned to create your own integrated, flexible personal style."],
["Egan","1 · Ingredients of helping","What is helping about, for Egan?","Helping clients manage problems and develop unused opportunities, and become better at helping themselves (a prevention mentality)."],
["Egan","1 · Ingredients of helping","Ingredients of successful therapy (common factors)?","The client and their context, the therapist, the relationship, the dialogue, two-way feedback, the treatment approach, problem management, decision-making, and beliefs, values and norms."],
["Egan","1 · Ingredients of helping","What is the 'shadow side' of helping?","The hidden, often unacknowledged factors (helper flaws, client games, systemic issues) that undermine helping."],
["Egan","2 · Relationship & values","Values that drive the relationship?","Respect (foundation), empathy (primary orientation), proactive appreciation of diversity, self-responsibility (empowerment), a bias for action (outcome focus)."],
["Egan","2 · Relationship & values","What is 'personal culture'?","How each individual lives out the beliefs, values and norms of the wider culture, so diversity is seen at the individual level."],
["Egan","3 · Tuning in & listening","What is SOLER?","Face the client Squarely, Open posture, Lean towards them, good Eye contact, Relaxed. Guidelines, not rules."],
["Egan","3 · Tuning in & listening","What does active listening attend to?","Clients' experiences, thoughts, behaviours and feelings, their nonverbal messages, and the key themes and context of the story."],
["Egan","3 · Tuning in & listening","Forms of distorted listening?","Filtered, evaluative, stereotype-based, fact-centred (rather than person-centred), sympathetic listening, and interrupting."],
["Egan","4 · Empathic responding","Three dimensions of responding skills?","Perceptiveness, know-how, assertiveness."],
["Egan","4 · Empathic responding","Egan's basic empathy formula?","'You feel… (emotion) because… (experience/behaviour)'. A training scaffold to be used naturally."],
["Egan","4 · Empathic responding","Poor substitutes for empathy?","No response, distracting questions, clichés, interpretations, advice, parroting, agreement and sympathy, and faking it."],
["Egan","5 · Probing & summarizing","Forms of probes?","Statements, requests, open questions, and single words or phrases. Follow a probe with empathy, not another probe."],
["Egan","5 · Probing & summarizing","When are summaries most useful?","At the start of a new session, when a session is going nowhere, and when the client needs a new perspective."],
["Egan","6–7 · Self-challenge","What are blind spots?","Things clients fail to see or choose not to see that keep them stuck. Challenge turns them into new perspectives."],
["Egan","6–7 · Self-challenge","Specific challenging skills?","Advanced empathy, information sharing, helper self-disclosure, immediacy, suggestions and recommendations, confrontation, and encouragement."],
["Egan","6–7 · Self-challenge","Reluctance vs resistance?","Reluctance is hesitancy to engage in the hard work that helping demands; resistance is the client fighting back against feeling coerced or pushed. Both are normal and need to be worked with, not punished."],
["Egan","6–7 · Self-challenge","Guidelines for inviting self-challenge?","Keep goals in mind, encourage self-challenge, earn the right to challenge, be tentative but not wishy-washy, build on strengths, be specific."],
["Egan","8 · Problem management","Why is the model 'not linear'?","Clients enter at any stage, move back and forth and work several tasks at once. The model is a shared map, not a script."],
["Egan","8 · Problem management","What is the action arrow?","All three stages sit on it: action should start immediately, continue throughout and lead to the preferred outcomes."],
["Egan","8 · Problem management","How should progress be evaluated?","Continuously, treating each case as an N = 1 'mini-experiment', with session and outcome feedback, not just at the end."],
["Egan","11–12 · Stage II","Why does hope matter in Stage II?","Problems close down the future; helping the client imagine possibilities builds hope and motivation."],
["Egan","11–12 · Stage II","What makes a good goal?","Outcome language, specific, makes a difference, realistic, prudent, sustainable, flexible, consistent with values, realistic time frame."],
["Egan","13 · Stage III","Action vs outcome vs impact?","Action is what the client does; the outcome is the result (seven months sober); the impact is the life change (feels better, new friends) (the case of Lacy)."],
["Egan","13 · Stage III","What is the balance-sheet method?","Weighing the gains and losses of a strategy for self and others, with acceptability and unacceptability, to choose the best fit."],
["Egan","14 · Implementation","What are implementation intentions?","Specific if-then plans for when, where and how to act, especially when obstacles are expected."],
["Egan","14 · Implementation","Inertia vs entropy?","Inertia is reluctance to get started; entropy is the tendency of changes to fall apart over time."],
["Egan","14 · Implementation","Outcome vs process resilience?","Outcome resilience means bouncing back to a previous state; process resilience means continual coping as a normal part of life."]
];

let gname="empathy",gs={q:[],i:0,r:0};
function lab(){
 const G=GAMES[gname];
 const head=`<div class="chips" id="gsel">${Object.entries(GAMES).map(([k,g])=>`<button aria-pressed="${k===gname}" data-g="${k}">${g.name}</button>`).join("")}</div>`;
 if(gs.i>=gs.q.length){const key="ie-g-"+gname,best=Math.max(store.get(key,0),gs.r);store.set(key,best);$("#lab").innerHTML=`${head}<div class="eyebrow">${G.name}</div><div class="score">${gs.r}/${gs.q.length}</div><p>Best: ${best}/${gs.q.length}.</p><button class="btn primary" id="ga">Play again</button>`;$("#ga").onclick=()=>startGame(gname);bindSel();return}
 const it=gs.q[gs.i];let answered=false;
 $("#lab").innerHTML=`${head}<div class="eyebrow">Practice · ${G.name} · ${gs.i+1}/${gs.q.length} · score ${gs.r}</div><h2 style="font-size:2.1rem">${G.intro}</h2><div class="bar"><i style="width:${gs.i/gs.q.length*100}%"></i></div>
 <div class="chat" style="margin-top:16px">${it[1]?`<div class="msg C"><div class="meta"><span class="who">Client</span></div>${esc(it[0])}</div><div class="msg T"><div class="meta"><span class="who">Counsellor</span></div>${esc(it[1])}</div>`:`<div class="msg T"><div class="meta"><span class="who">Helper</span></div>${esc(it[0])}</div>`}</div>
 <div class="opts">${G.opts.map((o,k)=>`<button data-k="${k}">${o}</button>`).join("")}</div><p id="gw"></p><div class="row" id="gn"></div>`;
 $("#lab .opts").onclick=e=>{const b=e.target.closest("button");if(!b||answered)return;answered=true;const ok=+b.dataset.k===it[2];if(ok)gs.r++;[...$("#lab .opts").children].forEach((x,k)=>{if(k===it[2])x.classList.add("right");x.disabled=true});if(!ok)b.classList.add("wrong");$("#gw").innerHTML=`<b>${ok?"Correct.":"Not quite."}</b> ${it[3]}`;$("#gn").innerHTML=`<button class="btn primary" id="gx">${gs.i+1<gs.q.length?"Next":"See score"}</button>`;$("#gx").onclick=()=>{gs.i++;lab()};$("#gx").focus()};
 bindSel();
}
function bindSel(){$("#gsel").onclick=e=>{const b=e.target.closest("button");if(b)startGame(b.dataset.g)}}
function startGame(n){gname=n;gs={q:shuffle(GAMES[n].items),i:0,r:0};lab()}

/* ---------- Flashcards (from viva bank) ---------- */
let deck=[],di=0,again=[],fbook="all";
function buildDeck(list){deck=list||shuffle(VIVA.filter(v=>fbook==="all"||v[0]===fbook));di=0;again=[];drawCard()}
function drawCard(){
 let h=`<div class="eyebrow">Flashcards · ${VIVA.length} cards</div><h2>Say it, then flip</h2><div class="chips" id="fb">${["all","Ivey","Egan"].map(b=>`<button aria-pressed="${fbook===b}" data-b="${b}">${b==="all"?"Both":b}</button>`).join("")}</div>`;
 if(di>=deck.length)h+=`<div class="face" style="position:static;min-height:180px;margin:16px 0"><div class="q">Deck done</div><div>${deck.length-again.length} of ${deck.length} known.</div></div><div class="row">${again.length?'<button class="btn primary" id="redo">Review missed</button>':""}<button class="btn" id="restart">Shuffle & restart</button></div>`;
 else{const c=deck[di];h+=`<div class="bar"><i style="width:${di/deck.length*100}%"></i></div><div class="fc" id="fc" tabindex="0" role="button" aria-label="Flip card"><div class="fc-in"><div class="face"><span class="eyebrow">${c[0]} · Ch ${c[1]} · ${di+1}/${deck.length}</span><div class="q">${c[2]}</div><span class="hint">Tap or press Space</span></div><div class="face back"><span class="eyebrow">Answer</span><div>${c[3]}</div></div></div></div><div class="row"><button class="btn" id="miss">Still learning (←)</button><button class="btn primary" id="got">Got it (→)</button></div>`}
 $("#cards").innerHTML=h;
 $("#fb").onclick=e=>{const b=e.target.closest("button");if(b){fbook=b.dataset.b;buildDeck()}};
 if(di>=deck.length){$("#restart").onclick=()=>buildDeck();if(again.length)$("#redo").onclick=()=>buildDeck(shuffle(again));return}
 $("#fc").onclick=()=>$("#fc").classList.toggle("flip");$("#got").onclick=()=>{di++;drawCard()};$("#miss").onclick=()=>{again.push(deck[di]);di++;drawCard()};
}
document.addEventListener("keydown",e=>{if($("#cards").hidden||!$("#fc")||e.target.matches("input,select,textarea"))return;if(e.code==="Space"){e.preventDefault();$("#fc").classList.toggle("flip")}if(e.key==="ArrowRight")$("#got")?.click();if(e.key==="ArrowLeft")$("#miss")?.click()});

/* ---------- Quiz (built from viva bank) ---------- */
let qs=[],qi=0,qr=0;
function startQuiz(){qs=shuffle(VIVA).slice(0,15).map(v=>{const wrong=shuffle(VIVA.filter(x=>x!==v&&x[0]===v[0])).slice(0,3).map(x=>x[3]);return {q:v[2],src:`${v[0]} · Ch ${v[1]}`,o:shuffle([{t:v[3],ok:true},...wrong.map(t=>({t,ok:false}))])}});qi=0;qr=0;drawQ()}
function drawQ(){
 if(qi>=qs.length){const p=Math.round(qr/qs.length*100),best=Math.max(p,store.get("ie-qbest",0));store.set("ie-qbest",best);$("#quiz").innerHTML=`<div class="eyebrow">Result</div><div class="score">${qr}/${qs.length}</div><p>${p>=80?"Viva ready.":p>=50?"Close. Go back to the viva bank for the ones you missed.":"Read through the viva bank first."} Best: ${best}%.</p><button class="btn primary" id="qa">New quiz</button>`;$("#qa").onclick=startQuiz;return}
 const q=qs[qi];let a=false;
 $("#quiz").innerHTML=`<div class="eyebrow">Quiz ${qi+1} of ${qs.length} · ${q.src} · score ${qr}</div><div class="bar" style="margin:10px 0"><i style="width:${qi/qs.length*100}%"></i></div><h2 style="font-size:2rem">${q.q}</h2><p class="hint">Pick the answer that belongs to this question.</p><div class="opts">${q.o.map((o,k)=>`<button data-k="${k}">${o.t}</button>`).join("")}</div><div class="row" id="qn"></div>`;
 $("#quiz .opts").onclick=e=>{const b=e.target.closest("button");if(!b||a)return;a=true;const p=q.o[+b.dataset.k];[...$("#quiz .opts").children].forEach((x,k)=>{if(q.o[k].ok)x.classList.add("right");x.disabled=true});if(p.ok)qr++;else b.classList.add("wrong");$("#qn").innerHTML=`<button class="btn primary" id="nq">${qi+1<qs.length?"Next":"See result"}</button>`;$("#nq").onclick=()=>{qi++;drawQ()};$("#nq").focus()};
}

/* ---------- Modes ---------- */
let labOn=false;
function mode(m){
 document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
 ["answers","viva","lab","cards","quiz"].forEach(id=>$("#"+id).hidden=id!==m);
 if(m==="viva")viva();
 if(m==="lab"&&!labOn){labOn=true;startGame(gname)}
 scrollTo(0,0);
}
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(b)mode(b.dataset.mode)};
arail();answer();prog();buildDeck();startQuiz();

</script>
